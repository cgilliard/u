name: test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run before it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform failing does not stop the others: each reports.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v5

      # The runners come with rustup; no third-party action is needed.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # Debug build: overflow checks and debug assertions are on.
      - name: Test
        run: cargo test --locked
