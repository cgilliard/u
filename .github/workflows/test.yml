name: test

on:
  push:
    branches: [main]
  pull_request:

# Every push is tested: runs of the same branch go side by side, and none
# cancels another.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The code is formatted as rustfmt formats it (miner/rustfmt.toml).
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable) with rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
          cargo fmt --version

      - name: Check formatting
        run: cargo fmt --check

      # Windows cannot hold a file named for one of its devices (aux, con,
      # nul, prn, com1...), whatever its extension, nor some characters,
      # nor a name ending in a dot or a space, nor two names that differ
      # only by case: with one such file the repository cannot be checked
      # out there at all. Linux holds them all, so it is checked here.
      - name: Check that Windows can hold every file
        working-directory: .
        run: |
          bad=$(git ls-files | grep -iE '(^|/)(con|prn|aux|nul|com[0-9]|lpt[0-9])(\.[^/]*)?$' || true)
          bad="$bad$(git ls-files | grep -E '[<>:"|?*\\]|[ .]$' || true)"
          bad="$bad$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)"
          if [ -n "$bad" ]; then echo "names Windows cannot hold:"; echo "$bad"; exit 1; fi

  test:
    name: test (${{ matrix.os }}, debug)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing does not stop the others: each reports.
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is Linux on arm64; macos-latest is arm64 too.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v5

      # The runners come with rustup; no third-party action is needed.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # The debug test suite: a debug build, so overflow checks and debug
      # assertions are on (the release build has its own job below). Built for
      # the runner's CPU (miner/.cargo/config.toml): the AVX2 code path on
      # the x86-64 runners, the portable one on the arm64 ones. The portable
      # path is the same code on any CPU without AVX2, so the arm64 runners
      # test it; the coverage job also builds it for the plainest x86-64.
      - name: Test
        run: cargo test --locked

  # The program at the size of a chain that has run for years, in small:
  # a state of 2,000,000 outputs, full blocks applied on it, and a new
  # node taking it (miner/tests/scale.rs). What each needed is printed as
  # SCALE lines. The same at full size is run nightly (scale.yml).
  scale:
    name: scale (2,000,000 outputs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Test
        run: cargo test --locked --release --features dev --test scale -- --ignored --nocapture --test-threads 1

  # The same tests in a release build: the optimized code a node runs,
  # without debug assertions or overflow checks. The fuzzers of the
  # decoders are quick here, so they run ten times their usual iterations.
  # Built with the dev feature, which no other job builds: the dev
  # networks' dataset in the binary, and the test that it is the right one.
  test-release:
    name: test (ubuntu-latest, release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TABMINER_FUZZ_SCALE: 10
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Test
        run: cargo test --locked --release --features dev

      # Every test marked #[ignore] is run somewhere: by the benchmarks,
      # or by a job of its own below.
      - name: Check that no ignored test is forgotten
        run: ./tools/ignored.sh

  # The slow tests: those marked #[ignore] that are not benchmarks, a job
  # each, in a release build. Two of them check constants of the source
  # against the circuits (the chain's programs and plans): a change to a
  # circuit fails them until the constants are made again.
  slow:
    name: slow (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test:
          # slow-tests:begin
          - aggregate::tree_tests::a_spend_rests_on_the_signature_tree
          - aggregate::tree_tests::a_signature_tree_of_two_levels
          - aggregate::tree_tests::aggregate_proof_roundtrip
          - aggregate::tree_tests::aggregate_tree_roundtrip
          - aggregate::tree_tests::chain_proofs_cover_history
          - aggregate::tree_tests::deep_tree_roundtrip
          - aggregate::tree_tests::dev_recursive_chain_constants
          - aggregate::tree_tests::mainnet_chain_constants
          - aggregate::tree_tests::mainnet_chain_timing
          - aggregate::tree_tests::mainnet_node_timing
          - aggregate::tree_tests::mainnet_plans
          - aggregate::tree_tests::mainnet_rate_timing
          - aggregate::tree_tests::mainnet_wrap_timing
          - aggregate::tree_tests::proving_can_be_cancelled
          - aggregate::tree_tests::security_configs
          - aggregate::tree_tests::security_configs_of_before
          - aggregate::tree_tests::security_configs_with_twice_the_queries
          - aggregate::tree_tests::soundness_parameters
          - aggregate::tree_tests::spanning_transaction_roundtrip
          - aggregate::tree_tests::the_chain_connects_only_proven_blocks
          - aggregate::tree_tests::write_fam_chain_proof
          - sig_air::tests::a_replaced_permutation_is_caught_where_it_is_used
          - block_air::circuit_tests::the_block_circuit_has_no_unintended_freedom
          - block_air::circuit_tests::the_circuit_agrees_with_the_chain_on_random_blocks
          - chain_verifier::tests::write_fam_verifier
          - miner::tests::blocks_of_a_recursive_network_build_on_the_proof_before
          - name_air::tests::has_no_unintended_freedom
          - pow::tests::write_dev_dataset
          - pow_air::tests::mainnet_attacks
          - pow_air::tests::mainnet_constraints_hold
          - pow_air::tests::mainnet_folds
          # slow-tests:end
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Test
        run: cargo test --locked --release --features dev --lib -- --ignored --exact --nocapture ${{ matrix.test }}

      # One of them writes a file of the repository, from the seed text:
      # the file kept must be the one it writes.
      - name: Check that nothing kept was changed
        working-directory: .
        run: git diff --exit-code

  # Code coverage of the tests, with the toolchain's own LLVM tools
  # (miner/tools/coverage.sh, which runs the same locally). The table is
  # shown on the run's summary page; the source annotated line by line is
  # the coverage-html artifact.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable, with llvm-tools)
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools --no-self-update
          rustup default stable
          rustc --version

      - name: Measure coverage
        run: ./tools/coverage.sh

      - name: Show the table on the run's page
        run: cat target/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the annotated source
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: miner/target/coverage/html
          retention-days: 14

  # The benchmarks: the timing tests marked #[ignore], built with --release
  # (miner/tools/bench.sh, which runs the same locally). The figures are
  # shown on the run's summary page and kept as the bench artifact. A
  # shared runner's timings vary from run to run.
  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Run the benchmarks
        run: ./tools/bench.sh

      - name: Show the figures on the run's page
        run: cat target/bench/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the figures
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: miner/target/bench/bench.txt
          retention-days: 90
